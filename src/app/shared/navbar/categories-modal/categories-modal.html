<!-- Fondo: al hacer click fuera del modal se cierra -->
<div (click)="closeModal()" class="fixed inset-0 bg-black/60 z-40" aria-hidden="true"></div>

<div role="dialog" aria-modal="true" class="fixed top-0 left-0 w-[300px] h-screen bg-gray-950 transition-all duration-300 ease-in-out z-50">

    <div class="flex items-center justify-between p-2 mb-4 border-b border-gray-600">
        <h2 class="text-white font-bold text-xl pl-4">Categorías</h2>

        <!-- Boton de cierre de categorias -->
        <button (click)="closeModal()" class="text-white hover:bg-gray-600 py-4 px-4 rounded-full hover:cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                <path d="M0 0h24v24H0z" fill="none" />
                <path fill="none" stroke="#808080" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21 21l-9-9m0 0L3 3m9 9l9-9m-9 9l-9 9" />
            </svg>
        </button>
 
    </div>

    <!-- Lista de categorias -->
    <ul class="flex flex-col gap-4 px-6">
        @for(category of categories(); track $index){
            <li class="text-white hover:text-red-500 cursor-pointer">{{ category.name }}</li>
        }
    </ul>

</div>
